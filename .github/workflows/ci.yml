name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install ruff
        run: pip install "ruff>=0.6"
      - name: Ruff check
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests
        run: pytest -q
      - name: Build distributions
        run: python -m build
      - name: Smoke test built wheel
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/python -m pip install --upgrade pip
          /tmp/smoke/bin/python -m pip install dist/*.whl
          /tmp/smoke/bin/oc-stats --version
          /tmp/smoke/bin/oc-stats --help | head -n 3
          /tmp/smoke/bin/oc-stats --help | grep -- --json
          /tmp/smoke/bin/oc-stats --help | grep -- --db

  windows:
    name: Windows smoke (Python 3.12)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project + dev deps
        run: python -m pip install --upgrade pip; pip install -e ".[dev]"
      - name: Ruff check
        run: ruff check .
      - name: Run tests
        run: pytest -q
      - name: Build wheel
        run: python -m build
      - name: Install wheel and smoke-test console
        shell: bash
        run: |
          python -m venv smoke
          # venv layout differs by platform: bin/ on POSIX, Scripts/ on Windows.
          if [ -x smoke/bin/python ]; then PY=smoke/bin/python; else PY=smoke/Scripts/python; fi
          "$PY" -m pip install --upgrade pip
          wheel="$(ls dist/*.whl | head -n1)"
          "$PY" -m pip install "$wheel"
          if [ -x smoke/bin/oc-stats ]; then EXE=smoke/bin/oc-stats; else EXE=smoke/Scripts/oc-stats; fi
          "$EXE" --version | grep -q "0.3.2"
          "$EXE" --help | grep -q -- "--json"
          "$EXE" --help | grep -q -- "--db"
          echo "Windows console smoke OK"
