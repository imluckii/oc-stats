name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install ruff
        run: pip install "ruff>=0.6"
      - name: Ruff check
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests
        run: pytest -q
      - name: Build distributions
        run: python -m build
      - name: Smoke test built wheel
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/python -m pip install --upgrade pip
          /tmp/smoke/bin/python -m pip install dist/*.whl
          /tmp/smoke/bin/oc-usage --version
          /tmp/smoke/bin/oc-usage --help | head -n 3
          /tmp/smoke/bin/oc-usage --help | grep -- --json
          if /tmp/smoke/bin/oc-usage --help | grep -q -- --db; then
            echo "removed --db flag still advertised"; exit 1
          fi
          # Removed flags must be rejected (argparse exit 2), not silently work.
          if /tmp/smoke/bin/oc-usage --db x >/tmp/err 2>&1; then
            echo "--db should have been rejected"; exit 1
          fi

  windows:
    name: Windows smoke (Python 3.12)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project + dev deps
        run: python -m pip install --upgrade pip; pip install -e ".[dev]"
      - name: Ruff check
        run: ruff check .
      - name: Run tests
        run: pytest -q
      - name: Build wheel
        run: python -m build
      - name: Install wheel and smoke-test console
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m venv smoke
          $smokePython = Join-Path $PWD "smoke\Scripts\python.exe"
          & $smokePython -m pip install --upgrade pip
          $wheel = (Get-ChildItem -Path dist -Filter *.whl | Select-Object -First 1).FullName
          & $smokePython -m pip install $wheel
          & .\smoke\Scripts\oc-usage.exe --version
          & .\smoke\Scripts\oc-usage.exe --help
          $help = & .\smoke\Scripts\oc-usage.exe --help
          if (-not ($help -match "--json")) { throw "JSON option missing from wheel" }
          if ($help -match "--db") { throw "Removed --db flag still advertised" }

          # A removed flag must be rejected (nonzero exit), not silently accepted.
          # Relax ErrorActionPreference for this one deliberately-failing call,
          # since a native command's nonzero exit (argparse writes the rejection
          # to stderr) otherwise aborts the whole step.
          $prev = $ErrorActionPreference
          $ErrorActionPreference = "Continue"
          & .\smoke\Scripts\oc-usage.exe --db x 2>$null
          $rc = $LASTEXITCODE
          $ErrorActionPreference = $prev
          if ($rc -eq 0) { throw "--db should have been rejected" }
